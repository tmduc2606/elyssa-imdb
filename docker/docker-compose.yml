# Elyssa-IMDb | Docker Compose — Full DE Stack (Memory Overhauled)
# Ports are remapped on the host side to prevent conflicts with local services.
#
# Service        Internal    Host Mapping    Purpose
# ─────────────  ──────────  ─────────────  ──────────────────────────
# postgres       5432        54321           Silver/Gold warehouse
# neo4j          7474/7687   7475/7688        Graph database
# rustfs         9000/9001   9100/9101       S3-compatible Bronze storage
# airflow        8080        8081            DAG orchestrator
# etl-runner     —           —               Dedicated DuckDB ETL engine
#
# Memory Budget (7 GB WSL):
#   postgres:   1.5g limit + 1g shm
#   neo4j:      1g limit + 256m shm (heap 512m + pagecache 512m)
#   rustfs:     256m limit
#   airflow:    2g limit + 1g shm
#   etl-runner: 2.5g limit + 1g shm
#   OS/WSL2:    ~1 GB headroom
#   Total:      ~7.5 GB (fits in 7 GB WSL + swap)

services:
  # ─── PostgreSQL + TimescaleDB ───────────────────────────────────
  postgres:
    image: elyssa-postgres:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    container_name: elyssa-postgres
    environment:
      POSTGRES_USER: elyssa
      POSTGRES_PASSWORD: elyssa_pg_2026
      POSTGRES_DB: elyssa_warehouse
    command: >
      postgres
        -c config_file=/etc/postgresql/custom.conf
        -c shared_preload_libraries=timescaledb
        -c max_connections=200
        -c shared_buffers=512MB
        -c work_mem=128MB
        -c maintenance_work_mem=256MB
        -c wal_level=replica
        -c max_wal_size=4GB
        -c effective_cache_size=1536MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=1000
        -c timezone=UTC
    shm_size: '1g'
    mem_limit: '1.5g'
    memswap_limit: '2g'
    oom_score_adj: 500
    ports:
      - "54321:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./postgres/custom.conf:/etc/postgresql/custom.conf:ro
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Neo4j ──────────────────────────────────────────────────────
  neo4j:
    image: elyssa-neo4j:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.neo4j
    container_name: elyssa-neo4j
    environment:
      NEO4J_AUTH: "neo4j/elyssa_neo_2026"
      NEO4J_server_memory_heap_max__size: "512M"
      NEO4J_server_memory_pagecache_size: "512M"
    mem_limit: '1g'
    memswap_limit: '1.5g'
    shm_size: '256m'
    oom_score_adj: 500
    ports:
      - "7475:7474"   # HTTP
      - "7688:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── RustFS (S3-compatible) ─────────────────────────────────────
  rustfs:
    image: elyssa-rustfs:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.rustfs
    container_name: elyssa-rustfs
    environment:
      RUSTFS_ACCESS_KEY: elyssa
      RUSTFS_SECRET_KEY: elyssa_s3_2026
      RUSTFS_REGION: us-east-1
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    oom_score_adj: 500
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # Admin Console
    volumes:
      - rustfs_data:/data
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: '256m'
    memswap_limit: '256m'

  # ─── ETL Runner (Dedicated DuckDB Engine) ───────────────────────
  # Runs Silver+Gold transformations with dedicated memory budget.
  # Does NOT share RAM with Airflow — prevents OOM from heavy ETL.
  etl-runner:
    image: elyssa-etl-runner:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.etl-runner
    container_name: elyssa-etl-runner
    mem_limit: 2.5g
    memswap_limit: 3g
    oom_score_adj: -500
    environment:
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: "2GB"
      DUCKDB_TEMP_DIR: "/tmp/duckdb_spill"
      POSTGRES_HOST: postgres
      POSTGRES_USER: elyssa
      POSTGRES_PASSWORD: elyssa_pg_2026
      POSTGRES_DB: elyssa_warehouse
    volumes:
      - ../data-engineering:/opt/etl/data-engineering:rw
      - etl_temp:/opt/etl/tmp:rw
      - airflow_data:/opt/airflow:rw
    shm_size: 2g
    networks:
      - elyssa-net
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Apache Airflow ─────────────────────────────────────────────
  airflow:
    image: elyssa-airflow:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: elyssa-airflow
    mem_limit: 2g
    memswap_limit: 3g
    oom_score_adj: -250
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://elyssa:elyssa_pg_2026@postgres:5432/elyssa_warehouse"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "utc"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: "utc"
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: "300"
      AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: "30"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "3600"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "30"
      AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD: "3600"
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
      AIRFLOW__CORE__LOG_FILENAME_TEMPLATE: "{{ti.dag_id}}/{{ti.task_id}}/{{ts}}/{{try_number}}.log"
      GOLD_EXPORT_PG_PASSWORD: "elyssa_pg_2026"
    ports:
      - "8081:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ../data-engineering:/opt/airflow/data-engineering:rw
      - ../data-engineering/orchestration/dags:/opt/airflow/dags:ro
      - ../data-engineering/orchestration/operators:/opt/airflow/operators:rw
      - etl_temp:/opt/airflow/output/tmp:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  pg_data:
    name: elyssa_pg_data
  neo4j_data:
    name: elyssa_neo4j_data
  neo4j_logs:
    name: elyssa_neo4j_logs
  rustfs_data:
    name: elyssa_rustfs_data
  airflow_data:
    name: elyssa_airflow_data
  etl_temp:
    name: elyssa_etl_temp

networks:
  elyssa-net:
    name: elyssa-net
    driver: bridge
