# Elyssa-IMDb | Docker Compose — DE Stack (Trimmed for Athlon 200GE)
# Ports remapped on host to prevent conflicts with local services.
#
# Service        Internal    Host Mapping    Purpose
# ─────────────  ──────────  ─────────────  ──────────────────────────
# postgres       5432        54321           Silver/Gold warehouse
# airflow        8080        8081            DAG orchestrator
# etl-runner     —           —               Dedicated DuckDB ETL engine
# rustfs         9000/9001   9100/9101       S3-compatible object store
#
# Bronze/Silver/Gold are bind-mounted to ../data-science/marts/ so they
# survive Docker wipes. The DS EDA notebook Part D reads from those paths.
#
# Memory Budget (R5 — trimmed for the ~10 GB WSL2 VM; keeps ~3 GB headroom):
#   postgres:   2.0g limit (shared_buffers=512MB, work_mem=64MB)
#   airflow:    2.5g limit (single-task, parallelism=1)
#   etl-runner: 2g limit (idle until silver/gold runs)
#   rustfs:     256m limit
#   Total caps: ~6.75 GB (68% of VM), ~3 GB VM headroom

services:
  # ─── PostgreSQL + TimescaleDB ───────────────────────────────────
  postgres:
    image: elyssa-postgres:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    container_name: elyssa-postgres
    environment:
      POSTGRES_USER: elyssa
      POSTGRES_PASSWORD: elyssa_pg_2026
      POSTGRES_DB: elyssa_warehouse
    command: >
      postgres
        -c config_file=/etc/postgresql/custom.conf
        -c shared_preload_libraries=timescaledb
        -c max_connections=200
        -c shared_buffers=512MB
        -c work_mem=64MB
        -c maintenance_work_mem=256MB
        -c wal_level=replica
        -c max_wal_size=1GB
        -c effective_cache_size=2GB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=1000
        -c timezone=UTC
    # shm_size 64m is Docker's default and ENOSPCs PostgreSQL DSM segments
    # ("could not resize shared memory segment ... No space left on device")
    # during parallel hash joins (e.g. agg_actor_cooccurrence self-join).
    # 1g tmpfs is demand-paged (no real RAM cost until used); belt-and-braces
    # with dynamic_shared_memory_type=sysv in postgres/custom.conf.
    shm_size: '1g'
    mem_limit: '2.0g'
    oom_score_adj: 500
    ports:
      - "54321:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./postgres/custom.conf:/etc/postgresql/custom.conf:ro
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── RustFS (S3-compatible Object Store) ─────────────────────────
  # S3 endpoint for all pipeline layers: imdb-source/, bronze/, gold-exports/
  # See https://github.com/rustfs/rustfs for documentation.
  rustfs:
    image: elyssa-rustfs:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.rustfs
    container_name: elyssa-rustfs
    mem_limit: 256m
    environment:
      RUSTFS_ACCESS_KEY: elyssa
      RUSTFS_SECRET_KEY: elyssa_s3_2026
      RUSTFS_REGION: us-east-1
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── ETL Runner (Dedicated DuckDB Engine) ───────────────────────
  # Runs Silver+Gold transformations with dedicated memory budget.
  # Does NOT share RAM with Airflow — prevents OOM from heavy ETL.
  etl-runner:
    image: elyssa-etl-runner:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.etl-runner
    container_name: elyssa-etl-runner
    mem_limit: 2g
    oom_score_adj: -500
    environment:
      PYTHONUNBUFFERED: "1"
      DUCKDB_THREADS: "2"
      DUCKDB_MEMORY_LIMIT: "2GB"
      DUCKDB_TEMP_DIR: "/tmp/duckdb_spill"
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: elyssa
      S3_SECRET_KEY: elyssa_s3_2026
      S3_REGION: us-east-1
      POSTGRES_HOST: postgres
      POSTGRES_USER: elyssa
      POSTGRES_PASSWORD: elyssa_pg_2026
      POSTGRES_DB: elyssa_warehouse
    volumes:
      - ../data-engineering:/opt/etl/data-engineering:rw
      - etl_temp:/opt/etl/tmp:rw
      - airflow_data:/opt/airflow:rw
    networks:
      - elyssa-net
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Apache Airflow ─────────────────────────────────────────────
  airflow:
    image: elyssa-airflow:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: elyssa-airflow
    # 2.5g: silver_export/gold_export stream 100M+ rows through DuckDB
    # postgres_scanner inside this container; 1.5g OOM-killed the export
    # and its retry loop blocked the only task slot for hours. R5: trimmed
    # from 3g so the ~10 GB WSL2 VM keeps ~3 GB headroom (no swap-thrash).
    mem_limit: 2.5g
    oom_score_adj: -250
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://elyssa:elyssa_pg_2026@postgres:5432/elyssa_warehouse"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "utc"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: "utc"
      AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "true"
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: "300"
      AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: "30"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "3600"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "30"
      AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD: "3600"
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
      AIRFLOW__CORE__LOG_FILENAME_TEMPLATE: "{{ti.dag_id}}/{{ti.task_id}}/{{ts}}/{{try_number}}.log"
      GOLD_EXPORT_PG_PASSWORD: "elyssa_pg_2026"
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: elyssa
      S3_SECRET_KEY: elyssa_s3_2026
      S3_REGION: us-east-1
    ports:
      - "18081:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ../data-engineering:/opt/airflow/data-engineering:rw
      - ../data-engineering/orchestration/dags:/opt/airflow/dags:ro
      - ../data-engineering/orchestration/operators:/opt/airflow/operators:rw
      - etl_temp:/opt/airflow/output/tmp:rw
      - ../data-science/marts/gold:/opt/airflow/output/gold:rw
      - ../data-science/marts/bronze:/opt/airflow/output/bronze:rw
      - ../data-science/marts/silver:/opt/airflow/output/silver:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  pg_data:
    name: elyssa_pg_data
  airflow_data:
    name: elyssa_airflow_data
  etl_temp:
    name: elyssa_etl_temp

networks:
  elyssa-net:
    name: elyssa-net
    driver: bridge
