# Elyssa-IMDb | PostgreSQL Custom Configuration
# Optimized for IMDb bulk ingestion workloads

# Connection Settings
listen_addresses = '*'
max_connections = 200

# Memory (tunable based on host)
shared_buffers = 512MB
work_mem = 64MB
maintenance_work_mem = 256MB
effective_cache_size = 2GB

# WAL (write-ahead log)
wal_level = replica
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Parallelism (tuned for 2-core/4-thread host: Athlon 200GE)
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# Dynamic Shared Memory (DSM)
# posix stores DSM in /dev/shm, a 64MB tmpfs under Docker by default, which
# ENOSPCs parallel hash joins (observed: "could not resize shared memory
# segment ... No space left on device" on agg_actor_cooccurrence). sysv uses
# kernel shared memory (host shmmax is effectively unlimited) and is immune
# to the container tmpfs limit. Paired with shm_size: 1g in docker-compose.
dynamic_shared_memory_type = sysv

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '

# Timezone
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Required for TimescaleDB
shared_preload_libraries = 'timescaledb'
