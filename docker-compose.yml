# Elyssa-IMDb | Docker Compose — Web Application Stack
# Memory-hardened for 16 GB host (AMD Athlon 200GE)
#
# Service        Internal    Host Mapping    Purpose
# ─────────────  ──────────  ─────────────  ──────────────────────────
# api            8000        8000            FastAPI + GraphQL gateway
# redis          6379        6379            Cache layer
#
# Usage:
#   docker compose up -d          # Start web services
#   docker compose down           # Stop all
#
# Expected RAM: ~1 GB
#   api 512m + redis 256m
#
# Note: This stack reads Gold marts from host-mounted volumes.
# Run the DE pipeline first or mount existing marts.

services:
  # ─── Web API — FastAPI + GraphQL ─────────────────────────────
  api:
    image: elyssa-api:latest
    build:
      context: web-application/api
      dockerfile: Dockerfile
    container_name: elyssa-api
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      ELYSSA_GOLD_MARTS_PATH: /data/marts/full
      ELYSSA_MODEL_ARTIFACTS_PATH: /data/marts/processed
      ELYSSA_DATABASE_URL: sqlite:///data/elyssa.db
      ELYSSA_DEBUG: "false"
      ELYSSA_REDIS_ENABLED: "true"
      ELYSSA_REDIS_URL: redis://redis:6379/0
      ELYSSA_RATE_LIMIT_PER_MINUTE: "200"
    ports:
      - "8000:8000"
    volumes:
      - ./data-science/marts/full:/data/marts/full:ro
      - ./data-science/marts/processed:/data/marts/processed:ro
      - api_data:/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Redis Cache ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: elyssa-redis
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - elyssa-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis_data:
    name: elyssa_redis_data
  api_data:
    name: elyssa_api_data

networks:
  elyssa-net:
    name: elyssa-net
    driver: bridge
