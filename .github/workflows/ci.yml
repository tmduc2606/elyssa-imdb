name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [data-engineering, data-science, web-application]
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found or tests require external services"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-application/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --silent
      - run: npm run lint --silent 2>/dev/null || true
      - run: npm run test -- --run 2>/dev/null || echo "No frontend tests configured"
