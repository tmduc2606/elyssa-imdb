name: Trivy Image Scan
on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - elyssa-api:latest
          - elyssa-model:latest
          - elyssa-frontend:latest
          - elyssa-airflow:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch model image + trivy export exceed runner disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/vcpkg /usr/local/swift
          docker rmi $(docker images -q) 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: Create DS staging dir (Dockerfile.model COPY source)
        run: |
          mkdir -p data-science/marts/processed
          cp -r data-science/tests/fixtures/processed/. data-science/marts/processed/ 2>/dev/null || true

      - name: Build ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'elyssa-ci-password' }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD || 'elyssa-ci-grafana' }}
          RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY || 'elyssa-ci-rustfs-secret' }}
        run: |
          docker compose -f mlops/docker-compose.yml build $(echo ${{ matrix.image }} | cut -d: -f1 | sed 's/^elyssa-//')
          docker builder prune -af 2>/dev/null || true

      - name: Run Trivy vulnerability scanner on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
