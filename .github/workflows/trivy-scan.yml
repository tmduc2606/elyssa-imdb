name: Trivy Image Scan
on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - elyssa-api:latest
          - elyssa-model:latest
          - elyssa-frontend:latest
          - elyssa-airflow:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }}
        run: docker compose -f mlops/docker-compose.yml build $(echo ${{ matrix.image }} | cut -d: -f1)

      - name: Run Trivy vulnerability scanner on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
