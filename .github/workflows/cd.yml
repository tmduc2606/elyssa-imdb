name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tmduc2606

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api
            compose_service: api
            dockerfile: mlops/docker/Dockerfile.api
          - name: frontend
            compose_service: frontend
            dockerfile: mlops/docker/Dockerfile.frontend
          - name: model
            compose_service: model
            dockerfile: mlops/docker/Dockerfile.model
          - name: airflow
            compose_service: airflow
            dockerfile: docker/Dockerfile.airflow
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'elyssa-ci-password' }}
        run: |
          mkdir -p data-science/marts/processed
          cp -r data-science/tests/fixtures/processed/. data-science/marts/processed/ 2>/dev/null || true
          docker compose -f mlops/docker-compose.yml build ${{ matrix.service.compose_service }}
          docker tag elyssa-${{ matrix.service.name }}:latest ${{ env.IMAGE_PREFIX }}/elyssa-${{ matrix.service.name }}:${{ github.sha }}
          docker tag elyssa-${{ matrix.service.name }}:latest ${{ env.IMAGE_PREFIX }}/elyssa-${{ matrix.service.name }}:latest
          docker push ${{ env.IMAGE_PREFIX }}/elyssa-${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/elyssa-${{ matrix.service.name }}:latest
