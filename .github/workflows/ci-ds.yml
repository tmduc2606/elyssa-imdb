name: DS CI
on:
  push:
    paths: ["data-science/**"]
  pull_request:
    paths: ["data-science/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.15
      - run: ruff check data-science/

  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir joblib scikit-learn==1.9.0
      - run: |
          python -c "
          from joblib import load
          import json
          load('data-science/tests/fixtures/processed/preprocessor.joblib')
          load('data-science/tests/fixtures/processed/genre_list_mlb.joblib')
          load('data-science/tests/fixtures/processed/scaler.joblib')
          json.load(open('data-science/tests/fixtures/processed/feature_columns.json'))
          json.load(open('data-science/tests/fixtures/processed/model_inventory.json'))
          print('All artifacts verified')
          "

  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir pyarrow pandas joblib catboost scikit-learn==1.9.0
      - run: python data-science/scripts/validate_contracts.py --processed-dir data-science/tests/fixtures/processed
