version: 2

models:
  - name: fact_performance
    description: "Performance fact with character expansion — grain: (tconst, ordering, nconst, character_name)"
    columns:
      - name: tconst
        tests: [not_null]
      - name: ordering
        tests: [not_null]
      - name: nconst
        tests: [not_null]
      - name: category
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tconst
            - ordering
            - nconst
            - character_name

  - name: fact_episode
    description: "Episode fact — grain: (episode_key)"
    columns:
      - name: episode_key
        tests: [unique, not_null]
      - name: series_key
        tests: [not_null]
      - name: season_number
        tests:
          - not_null:
              config:
                severity: warn
      - name: episode_number
        tests:
          - not_null:
              config:
                severity: warn
