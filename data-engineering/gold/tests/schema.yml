version: 2

models:
  - name: dim_title
    description: "Title dimension with enriched attributes"
    meta:
      owner: "de-team"
      lineage:
        sources: ["silver.title_basics", "silver.title_rating", "silver.title_episode"]
        transform: "int_title_details"
    columns:
      - name: tconst
        tests: [unique, not_null]
        meta:
          lineage_source: "silver.title_basics.tconst"
      - name: primary_title
        tests: [not_null]
        meta:
          lineage_source: "silver.title_basics.primary_title"
      - name: title_type
        tests: [not_null]
        meta:
          lineage_source: "silver.title_basics.title_type"
      - name: start_year
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1874
                max_value: 2030
              config:
                severity: warn
        meta:
          lineage_source: "silver.title_basics.start_year"
      - name: average_rating
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 10.0
        meta:
          lineage_source: "silver.title_rating.average_rating"
      - name: num_votes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
        meta:
          lineage_source: "silver.title_rating.num_votes"
      - name: runtime_minutes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 1000
              config:
                severity: warn
        meta:
          lineage_source: "silver.title_basics.runtime_minutes"
      - name: batch_id
        tests: []
      - name: ingested_at
        tests: []

  - name: dim_person
    description: "Person dimension with demographic attributes"
    columns:
      - name: nconst
        tests: [unique, not_null]
      - name: primary_name
        tests: [not_null]
      - name: birth_year
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1800
                max_value: 2030
              config:
                severity: warn

  - name: fact_title_rating
    description: "Title rating fact at grain (title_key, snapshot_date)"
    columns:
      - name: title_key
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: average_rating
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 10.0
      - name: num_votes
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fact_title_principal
    description: "Principal fact at grain (title_key, ordering)"
    columns:
      - name: title_key
        tests: [not_null]
      - name: name_key
        tests: [not_null]
      - name: ordering
        tests: [not_null]
      - name: character_name
        tests: []
      - name: category
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - title_key
            - ordering

  - name: fact_performance
    description: "Performance fact — LEFT JOIN to title_principal_char expands 1 principal into N rows (one per character). No simple PK exists. Use unique combination (tconst, ordering) for principal-level dedup."
    columns:
      - name: tconst
        tests: [not_null]
        description: "Title identifier (natural key)"
      - name: ordering
        tests: [not_null]
        description: "Principal ordering within title"
      - name: nconst
        tests: [not_null]
        description: "Person identifier"
      - name: category
        tests: [not_null]
        description: "Role category (actor, director, etc.)"
      - name: character_name
        tests: []
        description: "Character name — nullable, multiplies rows when present"

  - name: agg_actor_cooccurrence
    description: "Actor collaboration graph — one row per (actor_a, actor_b, shared_title), deduped to (tconst, nconst) grain before the fact_performance self-join (multi-character / multi-principal rows must not multiply pairs)."
    columns:
      - name: actor_a_nconst
        tests: [not_null]
        description: "First collaborator (natural key)"
      - name: actor_b_nconst
        tests: [not_null]
        description: "Second collaborator (natural key)"
      - name: shared_title
        tests: [not_null]
        description: "Title both actors appeared in (natural key)"
      - name: total_collaborations
        tests: []
        description: "Distinct shared titles between the pair (window count)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - actor_a_nconst
            - actor_b_nconst
            - shared_title
